[package]
name = "minipom-2"
version = "0.1.0"
edition = "2021"
description = "Native TUI pomodoro timer, task manager and time tracker"

[dependencies]
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# local wall-clock dates for the "today" rollup; std has no timezone support
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[profile.release]
lto = true
strip = true
