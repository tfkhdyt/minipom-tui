[package]
name = "minipom-tui"
version = "0.0.1"
edition = "2021"
description = "TUI pomodoro timer, task manager and time tracker"
license = "MIT"
repository = "https://github.com/tfkhdyt/minipom-tui"
readme = "README.md"
keywords = ["pomodoro", "tui", "timer", "time-tracking", "productivity"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
# display width of a character, so the marquee cuts text at cell boundaries
unicode-width = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# local wall-clock dates for the "today" rollup; std has no timezone support
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[profile.release]
lto = true
strip = true
